# Dependencies
markdown:	kramdown
highlighter: pygments
plugins: [jekyll-paginate]

# Setup
title: Summer Smith
tagline: 'Summer Smith'
description: 'Aesthetic software engineering'
url: http://summasmiff.github.io

author:
  name: 'Summer Smith'
  url: http://summasmiff.github.io

paginate:	20

collections:
  artworks:
    output: true
    permalink: /:collection/:year/:month/:day/:title/
    layout: artwork

defaults:
  - scope:
      path: ""
      type: "artworks"
    values:
      layout: "artwork"

  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Custom vars
icon: /assets/images/icon.gif
cover: /assets/images/cover.gif
version:	1.0.1
copyright: <p class="copyright">&copy;2026, <a href="http://summasmiff.github.io" target="_blank">Summer Smith</a>. <a href="http://creativecommons.org/licenses/by-nc/2.5/br/" target="_blank">Some rights reserved</a>.</p>
