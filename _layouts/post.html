---
layout: default
article: true
---

<header class="clean" style="height: 100%;">
	{% include sidebar.html %}
	<div id="post-info">
		<h1 class="plotter-text">{{ page.title }}<hr /></h1>
		<div class="post-content">
			{{ content }}
		</div>
		<nav class="post-navigation" aria-label="Post navigation">
			{% if page.previous %}<a href="{{ page.previous.url }}">Older: {{ page.previous.title }}</a>{% endif %}
			{% if page.next %}<a href="{{ page.next.url }}">Newer: {{ page.next.title }}</a>{% endif %}
		</nav>
		<a class="site-title" href="{{ site.url }}"><img src="{{ site.icon }}" class="site-icon-small">{{ site.title }}</a>
	</div>
</header>
